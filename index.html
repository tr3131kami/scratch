<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Pulse — 統計 + 速度テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0a1a;
    --bg-secondary: #12122a;
    --bg-glass: rgba(30, 30, 70, 0.55);
    --accent-cyan: #00f0ff;
    --accent-purple: #a855f7;
    --accent-pink: #ff2d95;
    --accent-green: #22c55e;
    --accent-orange: #ff8c42;
    --accent-red: #ef4444;
    --text-primary: #e8e8ff;
    --text-secondary: #8888bb;
    --border-glass: rgba(100, 100, 255, 0.15);
    --shadow-glow: 0 0 30px rgba(0, 240, 255, 0.15);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(168, 85, 247, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255, 45, 149, 0.04) 0%, transparent 70%);
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    font-size: 20px; line-height: 1; user-select: none;
    vertical-align: middle; transition: var(--transition);
  }
  .material-symbols-outlined.fill {
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }
  #particle-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px) saturate(180%);
    background: rgba(10, 10, 26, 0.75);
    border-bottom: 1px solid var(--border-glass);
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between;
    animation: slideDown 0.6s ease-out;
  }
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px;
  }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    animation: logoPulse 3s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }
  .logo-icon .material-symbols-outlined { font-size: 22px; }
  @keyframes logoPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0,240,255,0.3); }
    50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(168,85,247,0.5); }
  }
  .gradient-text {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.8rem; color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-green);
    animation: livePulse 1.8s ease-in-out infinite;
  }
  .status-dot.offline { background: var(--accent-red); animation: none; }
  .status-dot.proxy { background: var(--accent-orange); animation: none; }
  @keyframes livePulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
    50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(34,197,94,0); }
  }

  /* ============================================================
     速度テスト セクション
     ============================================================ */
  .speedtest-wrap {
    padding: 28px 32px 8px;
    position: relative; z-index: 10;
    animation: fadeInUp 0.7s ease-out both;
  }
  @keyframes fadeInUp {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .speedtest-card {
    background: linear-gradient(135deg, rgba(30, 30, 70, 0.7), rgba(20, 20, 50, 0.6));
    border: 1px solid var(--border-glass);
    border-radius: 22px;
    padding: 28px;
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }
  .speedtest-card::before {
    content: '';
    position: absolute; top: -50%; right: -20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,240,255,0.15), transparent 70%);
    pointer-events: none;
    animation: glowMove 8s ease-in-out infinite;
  }
  @keyframes glowMove {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-60px, 40px); }
  }
  .speedtest-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; position: relative; z-index: 2;
    flex-wrap: wrap; gap: 12px;
  }
  .speedtest-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.05rem; font-weight: 700;
  }
  .speedtest-title .material-symbols-outlined {
    font-size: 24px;
    color: var(--accent-cyan);
    animation: signalSpin 4s linear infinite;
  }
  @keyframes signalSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .speedtest-body {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
    align-items: center;
    position: relative; z-index: 2;
  }
  @media (max-width: 720px) {
    .speedtest-body { grid-template-columns: 1fr; }
  }

  /* ---- 円形ゲージ ---- */
  .gauge-wrap {
    position: relative;
    width: 240px; height: 240px;
    margin: 0 auto;
    filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.25));
  }
  .gauge-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-bg {
    fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 14;
  }
  .gauge-track {
    fill: none; stroke: url(#gaugeGrad); stroke-width: 14;
    stroke-linecap: round;
    stroke-dasharray: 691;
    stroke-dashoffset: 691;
    transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .gauge-inner {
    position: absolute; inset: 24px;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(20,20,50,0.9), rgba(10,10,26,0.6));
    border: 1px solid var(--border-glass);
  }
  .gauge-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.6rem; font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #fff, var(--accent-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: var(--transition);
  }
  .gauge-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; color: var(--text-secondary);
    margin-top: 4px; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gauge-phase {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: var(--accent-cyan);
    margin-top: 8px; letter-spacing: 1px;
    text-transform: uppercase; font-weight: 700;
  }

  /* ---- メトリクス ---- */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 480px) {
    .metrics { grid-template-columns: 1fr; }
  }
  .metric {
    background: rgba(20, 20, 50, 0.55);
    border: 1px solid var(--border-glass);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .metric:hover {
    transform: translateY(-3px);
    border-color: rgba(0, 240, 255, 0.3);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .metric-icon {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
  }
  .metric-icon .material-symbols-outlined {
    font-size: 22px;
  }
  .metric.download .metric-icon .material-symbols-outlined { color: var(--accent-cyan); }
  .metric.upload .metric-icon .material-symbols-outlined { color: var(--accent-purple); }
  .metric.ping .metric-icon .material-symbols-outlined { color: var(--accent-green); }
  .metric-label {
    font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem; font-weight: 800;
    color: var(--text-primary);
    line-height: 1;
    transition: var(--transition);
  }
  .metric-unit {
    font-size: 0.7rem; color: var(--text-secondary);
    margin-left: 3px; font-weight: 400;
  }

  /* ---- ボタン ---- */
  .speedtest-actions {
    margin-top: 22px;
    display: flex; gap: 12px; flex-wrap: wrap;
    position: relative; z-index: 2;
  }
  .btn-start {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    border: none; color: #fff;
    padding: 14px 30px;
    border-radius: 12px;
    font-weight: 700; font-size: 0.95rem;
    cursor: pointer; transition: var(--transition);
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 24px rgba(0, 240, 255, 0.25);
  }
  .btn-start:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 32px rgba(0, 240, 255, 0.4);
  }
  .btn-start:active:not(:disabled) { transform: scale(0.98); }
  .btn-start:disabled {
    opacity: 0.5; cursor: not-allowed;
    background: rgba(100,100,150,0.3);
    box-shadow: none;
  }
  .btn-start .material-symbols-outlined { font-size: 20px; }
  .btn-start.running .material-symbols-outlined {
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .speedtest-info {
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap; font-size: 0.78rem;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  .speedtest-info .item {
    display: flex; align-items: center; gap: 6px;
  }
  .speedtest-info .material-symbols-outlined { font-size: 16px; }

  /* ---- 進行ログ ---- */
  .speedtest-log {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-secondary);
    max-height: 60px;
    overflow-y: auto;
    padding: 8px 12px;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    position: relative; z-index: 2;
    line-height: 1.6;
  }
  .speedtest-log .line { animation: logLine 0.3s ease-out; }
  .speedtest-log .ok { color: var(--accent-green); }
  .speedtest-log .info { color: var(--accent-cyan); }
  .speedtest-log .warn { color: var(--accent-orange); }
  @keyframes logLine {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ============================================================
     以下、Scratch Pulse の既存スタイル
     ============================================================ */
  .search-wrap {
    padding: 28px 32px 8px;
    position: relative; z-index: 10;
    animation: fadeInUp 0.7s ease-out 0.1s both;
  }
  .search-box {
    display: flex; gap: 10px; max-width: 720px;
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius);
    padding: 6px;
    backdrop-filter: blur(12px);
    transition: var(--transition);
    box-shadow: var(--shadow-glow);
    align-items: center;
  }
  .search-box:focus-within {
    border-color: rgba(0, 240, 255, 0.5);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
    transform: translateY(-2px);
  }
  .search-type-wrap {
    display: flex; align-items: center; gap: 6px;
    padding: 0 12px;
    border-right: 1px solid var(--border-glass);
    color: var(--text-secondary);
  }
  .search-type-wrap .material-symbols-outlined { font-size: 20px; color: var(--accent-cyan); }
  .search-box select {
    background: transparent; border: none; color: var(--text-primary);
    padding: 10px 4px;
    font-family: 'Inter', sans-serif; font-size: 0.9rem;
    outline: none; cursor: pointer;
  }
  .search-box select option { background: var(--bg-secondary); }
  .search-box input {
    flex: 1; background: transparent; border: none;
    color: var(--text-primary); padding: 12px 8px;
    font-size: 0.95rem; outline: none;
    font-family: 'Inter', sans-serif; min-width: 0;
  }
  .search-box input::placeholder { color: var(--text-secondary); }
  .search-box button {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    border: none; color: #fff; padding: 12px 22px;
    border-radius: var(--radius-sm);
    font-weight: 600; font-size: 0.9rem; cursor: pointer;
    transition: var(--transition); white-space: nowrap;
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; gap: 6px;
  }
  .search-box button .material-symbols-outlined { font-size: 20px; }
  .search-box button:hover { transform: scale(1.04); box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
  .main-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    padding: 20px 32px 40px;
    position: relative; z-index: 10;
  }
  .stat-card {
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius);
    padding: 20px 22px;
    backdrop-filter: blur(12px);
    transition: var(--transition);
    position: relative; overflow: hidden;
    animation: cardEnter 0.5s ease-out both;
  }
  @keyframes cardEnter {
    from { transform: translateY(20px) scale(0.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    opacity: 0; transition: opacity 0.3s;
  }
  .stat-card:hover {
    transform: translateY(-6px);
    border-color: rgba(0, 240, 255, 0.3);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 240, 255, 0.1);
  }
  .stat-card:hover::before { opacity: 1; }
  .stat-label {
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text-secondary);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-label .material-symbols-outlined { font-size: 15px; color: var(--accent-cyan); opacity: 0.8; }
  .stat-value {
    font-size: 2rem; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fff, var(--accent-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1; transition: var(--transition);
    word-break: break-word;
  }
  .stat-value.text { font-size: 1.1rem; font-family: 'Inter', sans-serif; font-weight: 700; }
  .stat-sub {
    font-size: 0.78rem; color: var(--text-secondary);
    margin-top: 6px; font-family: 'JetBrains Mono', monospace;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .stat-sub .material-symbols-outlined { font-size: 14px; color: var(--accent-pink); opacity: 0.7; }
  .stat-icon {
    position: absolute; top: 16px; right: 18px;
    color: var(--text-secondary); opacity: 0.3;
    transition: var(--transition);
  }
  .stat-icon .material-symbols-outlined { font-size: 26px; }
  .stat-card:hover .stat-icon { opacity: 0.7; transform: scale(1.12) rotate(-6deg); color: var(--accent-cyan); }
  .section-title {
    grid-column: 1 / -1;
    font-size: 1.05rem; font-weight: 700;
    padding: 12px 0 4px;
    display: flex; align-items: center; gap: 10px;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-glass);
    margin-top: 12px;
  }
  .section-title .material-symbols-outlined { font-size: 22px; color: var(--accent-cyan); }
  .section-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan);
  }
  .loader {
    grid-column: 1 / -1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 0; gap: 16px;
  }
  .loader-ring {
    width: 48px; height: 48px;
    border: 3px solid var(--border-glass);
    border-top-color: var(--accent-cyan);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  .loader-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; color: var(--text-secondary);
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.4; } }
  .error-card {
    grid-column: 1 / -1;
    background: rgba(255, 45, 100, 0.1);
    border: 1px solid rgba(255, 45, 100, 0.3);
    border-radius: var(--radius);
    padding: 24px; color: #ff6b9d;
    font-size: 0.9rem;
    font-family: 'JetBrains Mono', monospace;
    animation: shake 0.5s ease-out;
  }
  .error-card .err-title {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; margin-bottom: 12px; color: #ff4d7e;
  }
  .error-card .err-body { font-size: 0.82rem; line-height: 1.6; color: #ff9bb8; white-space: pre-wrap; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .chart-card {
    grid-column: span 2;
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius);
    padding: 22px;
    backdrop-filter: blur(12px);
    animation: cardEnter 0.6s ease-out both;
  }
  .chart-title {
    font-size: 0.85rem; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 18px;
    text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .chart-title .material-symbols-outlined { font-size: 20px; color: var(--accent-purple); }
  .bar-chart { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: flex; align-items: center; gap: 12px; animation: barGrow 0.8s ease-out both; }
  @keyframes barGrow {
    from { transform: scaleX(0); transform-origin: left; opacity: 0; }
    to { transform: scaleX(1); transform-origin: left; opacity: 1; }
  }
  .bar-label {
    width: 130px; font-size: 0.78rem;
    color: var(--text-secondary); text-align: right; flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-track { flex: 1; height: 10px; background: rgba(255, 255, 255, 0.06); border-radius: 6px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
  }
  .bar-fill::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .bar-value {
    width: 80px; font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-cyan); text-align: right; flex-shrink: 0;
  }
  .toast-container {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 999; display: flex; flex-direction: column; gap: 10px;
  }
  .toast {
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    backdrop-filter: blur(16px);
    font-size: 0.85rem; color: var(--text-primary);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    animation: toastIn 0.4s ease-out, toastOut 0.4s ease-in 3.6s forwards;
    max-width: 340px;
    display: flex; align-items: center; gap: 10px;
  }
  .toast .material-symbols-outlined { font-size: 20px; color: var(--accent-cyan); flex-shrink: 0; }
  @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
  footer {

  .tabs {

    transition: width 0.4s ease-out; border-radius: 2px;
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header>
  <div class="logo">
    <div class="logo-icon">
      <span class="material-symbols-outlined fill">bolt</span>
    </div>

<!-- ============================================================
     速度テスト セクション

<section class="speedtest-wrap">

    <div class="speedtest-header">

      <div class="speedtest-info">
        <span class="item"><span class="material-symbols-outlined">public</span><span id="serverInfo">Cloudflare</span></span>
        <span class="item"><span class="material-symbols-outlined">history</span><span id="lastTest">未実行</span></span>
      </div>
    </div>

    <div class="speedtest-body">
      <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="0 0 240 240">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff"/>

      <div>
        <div class="metrics">

          </div>

        </div>
      </div>

  </div>
</section>

<!-- ============================================================
     Scratch Pulse 検索
     ============================================================ -->
<div class="search-wrap">
  <div class="search-box">
    <div class="search-type-wrap">
      <span class="material-symbols-outlined" id="typeIcon">person</span>
      <select id="searchType">
        <option value="users">ユーザー</option>
        <option value="projects">プロジェクト</option>
        <option value="studios">スタジオ</option>
      </select>
    </div>
    <input type="text" id="searchInput" placeholder="ユーザー名 / プロジェクト ID / スタジオ ID..." autocomplete="off">
    <button id="searchBtn">
      <span class="material-symbols-outlined">analytics</span>
      分析
    </button>
  </div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<main class="main-grid" id="dashboard">
  <div class="loader" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Scratch Pulse 起動中...</div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<footer>
  <span class="material-symbols-outlined">bolt</span>
  Scratch Pulse v1.1 — Speed Test + Scratch Stats
</footer>

<script>
/* ============================================================
   Scratch Pulse + Speed Test
   ============================================================ */

const API_BASE = 'https://api.scratch.mit.edu';
const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://cors.eu.org/${url}`
];

/* 速度テスト用エンドポイント（Cloudflare 公開・CORS 対応） */
const SPEEDTEST_URL = 'https://speed.cloudflare.com';
const DOWN_URL = (bytes) => `${SPEEDTEST_URL}/__down?bytes=${bytes}`;
const UP_URL = `${SPEEDTEST_URL}/__up`;

const $ = id => document.getElementById(id);

/* ---- アイコンヘルパー ---- */
function icon(name, opts = {}) {
  const fill = opts.fill ? ' fill' : '';
  const style = opts.size ? ` style="font-size:${opts.size}px"` : '';
  return `<span class="material-symbols-outlined${fill}"${style}>${name}</span>`;
}

/* ============================================================
   パーティクル背景
   ============================================================ */
(function initParticles() {
  const canvas = $('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.8 + 0.5,
      dx: (Math.random() - 0.5) * 0.3, dy: (Math.random() - 0.5) * 0.3,
      color: ['rgba(0,240,255,', 'rgba(168,85,247,', 'rgba(255,45,149,'][Math.floor(Math.random()*3)]
    });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color + '0.4)'; ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(0,240,255,' + (0.06 * (1 - dist / 120)) + ')';
          ctx.lineWidth = 0.6; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---- トースト ---- */
function toast(msg, iconName = 'check_circle') {
  const c = $('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${icon(iconName)}<span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* ============================================================
   ★ 速度テスト ロジック
   ============================================================ */
const speedTest = {
  running: false,
  aborted: false,
  controller: null,

  /* ログ追加 */
  log(msg, type = 'info') {
    const log = $('speedtestLog');
    const line = document.createElement('div');
    line.className = 'line ' + type;
    const time = new Date().toLocaleTimeString('ja-JP');
    line.textContent = `[${time}] ${msg}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  },

  /* ゲージ更新 */
  updateGauge(value, max = 200) {
    const pct = Math.min(value / max, 1);
    const CIRC = 2 * Math.PI * 110; // = 691
    $('gaugeTrack').style.strokeDashoffset = CIRC * (1 - pct);
    $('gaugeValue').textContent = value < 10 ? value.toFixed(1) : Math.round(value);
  },

  /* フェーズ表示 */
  setPhase(text) { $('gaugePhase').textContent = text; },

  /* Ping 計測 */
  async measurePing() {
    this.setPhase('PING');
    this.log('Ping を計測中...', 'info');
    const samples = [];
    for (let i = 0; i < 5; i++) {
      const t0 = performance.now();
      try {
        await fetch(DOWN_URL(0) + '&r=' + Math.random(), { cache: 'no-store' });
        const dt = performance.now() - t0;
        samples.push(dt);
      } catch (_) {}
      await new Promise(r => setTimeout(r, 100));
    }
    if (samples.length === 0) throw new Error('Ping 失敗');
    samples.sort((a, b) => a - b);
    const median = samples[Math.floor(samples.length / 2)];
    const jitter = samples.length > 1
      ? (samples[samples.length - 1] - samples[0]) : 0;
    this.log(`Ping: ${median.toFixed(1)} ms (jitter ${jitter.toFixed(1)} ms)`, 'ok');
    return { ping: median, jitter };
  },

  /* ダウンロード計測 */
  async measureDownload() {
    this.setPhase('DOWNLOAD');
    this.log('ダウンロード速度を計測中...', 'info');

    const sizes = [1e6, 5e6, 10e6, 25e6];
    let bestSpeed = 0;
    let totalBytes = 0, totalTime = 0;

    for (const size of sizes) {
      if (this.aborted) throw new Error('aborted');
      try {
        const t0 = performance.now();
        const res = await fetch(DOWN_URL(size) + '&r=' + Math.random(), { cache: 'no-store' });
        const blob = await res.blob();
        const dt = (performance.now() - t0) / 1000;
        const mbps = (blob.size * 8) / dt / 1e6;
        totalBytes += blob.size;
        totalTime += dt;
        const avg = (totalBytes * 8) / totalTime / 1e6;
        bestSpeed = Math.max(bestSpeed, avg);

        // リアルタイム表示
        $('dlValue').innerHTML = `${avg.toFixed(2)}<span class="metric-unit">Mbps</span>`;
        this.updateGauge(avg);
        this.log(`DL: ${blob.size/1e6}MB → ${mbps.toFixed(2)} Mbps`, 'ok');
      } catch (e) {
        if (this.aborted) throw e;
        this.log(`DL 試行失敗 (${size/1e6}MB)`, 'warn');
      }
    }
    if (bestSpeed === 0) throw new Error('ダウンロード失敗');
    return bestSpeed;
  },

  /* アップロード計測 */
  async measureUpload() {
    this.setPhase('UPLOAD');
    this.log('アップロード速度を計測中...', 'info');

    const sizes = [256e3, 1e6, 2e6, 5e6];
    let bestSpeed = 0;

    for (const size of sizes) {
      if (this.aborted) throw new Error('aborted');
      try {
        const payload = new Uint8Array(size);
        crypto.getRandomValues(payload.subarray(0, Math.min(size, 65536)));

        const t0 = performance.now();
        await fetch(UP_URL, {
          method: 'POST',
          body: payload,
          cache: 'no-store'
        });
        const dt = (performance.now() - t0) / 1000;
        const mbps = (size * 8) / dt / 1e6;
        bestSpeed = Math.max(bestSpeed, mbps);

        $('ulValue').innerHTML = `${mbps.toFixed(2)}<span class="metric-unit">Mbps</span>`;
        this.updateGauge(mbps);
        this.log(`UL: ${size/1e6}MB → ${mbps.toFixed(2)} Mbps`, 'ok');
      } catch (e) {
        if (this.aborted) throw e;
        this.log(`UL 試行失敗 (${size/1e6}MB)`, 'warn');
      }
    }
    if (bestSpeed === 0) throw new Error('アップロード失敗');
    return bestSpeed;
  },

  /* 全テスト実行 */
  async run() {
    if (this.running) return;
    this.running = true;
    this.aborted = false;
    this.controller = new AbortController();

    const btnStart = $('btnStart');
    const btnStop = $('btnStop');
    btnStart.disabled = true;
    btnStart.classList.add('running');
    btnStop.disabled = false;

    // リセット
    $('dlValue').innerHTML = '—<span class="metric-unit">Mbps</span>';
    $('ulValue').innerHTML = '—<span class="metric-unit">Mbps</span>';
    $('pingValue').innerHTML = '—<span class="metric-unit">ms</span>';
    $('speedtestLog').innerHTML = '';
    this.log('速度テストを開始します', 'info');

    try {
      // 1) Ping
      const { ping, jitter } = await this.measurePing();
      $('pingValue').innerHTML = `${Math.round(ping)}<span class="metric-unit">ms</span>`;

      // 2) Download
      const dl = await this.measureDownload();
      $('dlValue').innerHTML = `${dl.toFixed(2)}<span class="metric-unit">Mbps</span>`;

      // 3) Upload
      const ul = await this.measureUpload();
      $('ulValue').innerHTML = `${ul.toFixed(2)}<span class="metric-unit">Mbps</span>`;

      this.setPhase('完了');
      $('lastTest').textContent = new Date().toLocaleTimeString('ja-JP');
      this.log(`✅ 完了 — DL ${dl.toFixed(1)} / UL ${ul.toFixed(1)} / Ping ${Math.round(ping)}ms`, 'ok');
      toast(`速度テスト完了 — DL ${dl.toFixed(1)} Mbps`, 'speed');

      // 結果をダッシュボードにも反映
      renderSpeedResult({ dl, ul, ping, jitter });
    } catch (e) {
      if (this.aborted) {
        this.log('⏹ テストを中止しました', 'warn');
        this.setPhase('中止');
      } else {
        this.log('❌ エラー: ' + e.message, 'warn');
        this.setPhase('失敗');
      }
    } finally {
      this.running = false;
      btnStart.disabled = false;
      btnStart.classList.remove('running');
      btnStop.disabled = true;
    }
  },

  stop() {
    if (!this.running) return;
    this.aborted = true;
    if (this.controller) this.controller.abort();
  }
};

/* ---- 結果をダッシュボードに反映 ---- */
function renderSpeedResult({ dl, ul, ping, jitter }) {
  // 既存の結果カードを削除
  document.querySelectorAll('.speed-result-card').forEach(el => el.remove());

  const d = $('dashboard');
  if (!d) return;

  const row = document.createElement('div');
  row.className = 'speed-result-card';
  row.style.gridColumn = '1 / -1';
  row.style.display = 'contents';

  const section = sectionTitle('直近の速度テスト結果', 'speed');
  section.classList.add('speed-result-card');
  d.prepend(section);

  const cards = [
    statCard('ダウンロード', dl.toFixed(2) + ' Mbps', 'download',
      'Cloudflare 経由', { text: true, color: 'color:var(--accent-cyan)' }),
    statCard('アップロード', ul.toFixed(2) + ' Mbps', 'upload',
      'Cloudflare 経由', { text: true, color: 'color:var(--accent-purple)' }),
    statCard('Ping', Math.round(ping) + ' ms', 'network_check',
      `Jitter ${jitter.toFixed(1)} ms`, { text: true, color: 'color:var(--accent-green)' })
  ];
  cards.forEach(c => { c.classList.add('speed-result-card'); d.prepend(c); });

  // チャート
  const chart = barChart('速度テスト結果', [
    { label: 'ダウンロード', value: dl },
    { label: 'アップロード', value: ul },
    { label: 'Ping (ms)', value: ping }
  ]);
  chart.classList.add('speed-result-card');
  d.prepend(chart);
}

/* ---- ボタンイベント ---- */
$('btnStart').addEventListener('click', () => speedTest.run());
$('btnStop').addEventListener('click', () => speedTest.stop());

/* ============================================================
   Scratch API 関連（既存）
   ============================================================ */
function setStatus(state, text) {
  const dot = $('statusDot');
  dot.classList.remove('offline', 'proxy');
  if (state === 'offline') dot.classList.add('offline');
  if (state === 'proxy') dot.classList.add('proxy');
  $('apiStatus').textContent = text;
}

async function apiFetch(path) {
  const targetUrl = API_BASE + path;
  try {
    const res = await fetch(targetUrl);
    if (res.ok) { setStatus('online', '接続済み'); return await res.json(); }
  } catch (_) {}
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    try {
      const res = await fetch(CORS_PROXIES[i](targetUrl));
      if (res.ok) { setStatus('proxy', 'プロキシ経由'); return await res.json(); }
    } catch (_) {}
  }
  setStatus('offline', '接続失敗');
  throw new Error('すべての接続経路で失敗しました');
}

function setProgress(pct) { $('progressBar').style.width = pct + '%'; }

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString('ja-JP');
}

let cardIndex = 0;
function statCard(label, value, iconName = 'analytics', sub = '', opts = {}) {
  const el = document.createElement('div');
  el.className = 'stat-card';
  el.style.animationDelay = (cardIndex++ * 0.04) + 's';
  const isText = opts.text || (typeof value === 'string' && isNaN(parseFloat(value)));
  const valueHtml = isText
    ? `<div class="stat-value text" style="${opts.color || ''}">${value ?? ''}</div>`
    : `<div class="stat-value" style="${opts.color || ''}">${fmt(value)}</div>`;
  el.innerHTML = `
    <div class="stat-icon">${icon(iconName)}</div>
    <div class="stat-label">${icon(opts.labelIcon || iconName, { size: 15 })}${label}</div>
    ${valueHtml}
    ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
  `;
  return el;
}

function sectionTitle(text, iconName = 'widgets') {
  const el = document.createElement('div');
  el.className = 'section-title';
  el.innerHTML = `<span class="dot"></span>${icon(iconName)} ${text}`;
  return el;
}

function barChart(title, data) {
  const el = document.createElement('div');
  el.className = 'chart-card';
  el.style.animationDelay = (cardIndex++ * 0.06) + 's';
  const max = Math.max(...data.map(d => d.value), 1);
  el.innerHTML = `
    <div class="chart-title">${icon('bar_chart')}${title}</div>
    <div class="bar-chart">
      ${data.map((d, i) => `
        <div class="bar-row" style="animation-delay:${i * 0.08}s">
          <div class="bar-label" title="${d.label}">${d.label}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:0%;transition-delay:${i * 0.1}s"
                 data-width="${(d.value / max * 100).toFixed(1)}"></div>
          </div>
          <div class="bar-value">${fmt(d.value)}</div>
        </div>
      `).join('')}
    </div>
  `;
  requestAnimationFrame(() => {
    setTimeout(() => {
      el.querySelectorAll('.bar-fill').forEach(b => b.style.width = b.dataset.width + '%');
    }, 100);
  });
  return el;
}

function showError(title, message) {
  const d = $('dashboard');
  d.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'error-card';
  el.innerHTML = `
    <div class="err-title">${icon('error')}<span>${title}</span></div>
    <div class="err-body">${message}</div>
  `;
  d.appendChild(el);
}

function hideLoader() { const l = $('loader'); if (l) l.remove(); }
function clearDashboard() { $('dashboard').innerHTML = ''; cardIndex = 0; }

/* ---- ユーザー分析 ---- */
async function analyzeUser(username) {
  clearDashboard(); setProgress(10);
  toast(`ユーザー「${username}」を分析中...`, 'search');
  try {
    const user = await apiFetch(`/users/${username}`);
    setProgress(30);
    const [followers, following, projects, favorites, studios] = await Promise.allSettled([
      apiFetch(`/users/${username}/followers?limit=40`),
      apiFetch(`/users/${username}/following?limit=40`),
      apiFetch(`/users/${username}/projects?limit=40`),
      apiFetch(`/users/${username}/favorites?limit=40`),
      apiFetch(`/users/${username}/studios?limit=40`)
    ]);
    setProgress(60);
    const d = $('dashboard');
    d.appendChild(sectionTitle('プロフィール', 'person'));
    d.appendChild(statCard('ユーザー名', user.username, 'badge', `ID: ${user.id}`, { text: true }));
    d.appendChild(statCard('参加日', user.history?.joined ? new Date(user.history.joined).toLocaleDateString('ja-JP') : '—', 'calendar_month', '', { text: true }));
    d.appendChild(statCard('国', user.profile?.country || '未設定', 'public', '', { text: true }));
    d.appendChild(statCard('Scratcher歴', user.history?.joined ? `${Math.floor((Date.now() - new Date(user.history.joined)) / 86400000)} 日` : '—', 'schedule', '', { text: true }));
    d.appendChild(sectionTitle('統計', 'monitoring'));
    d.appendChild(statCard('フォロワー', user.stats?.followers, 'group', '', { color: 'color:var(--accent-cyan)' }));
    d.appendChild(statCard('フォロー中', user.stats?.following, 'person_raised_hand'));
    d.appendChild(statCard('プロジェクト数', projects.status === 'fulfilled' ? projects.value.length : '—', 'deployed_code'));
    d.appendChild(statCard('お気に入り', favorites.status === 'fulfilled' ? favorites.value.length : '—', 'star'));
    d.appendChild(statCard('所属スタジオ', studios.status === 'fulfilled' ? studios.value.length : '—', 'palette'));
    setProgress(80);
    d.appendChild(barChart('ユーザー活動指標', [
      { label: 'フォロワー', value: user.stats?.followers || 0 },
      { label: 'フォロー中', value: user.stats?.following || 0 },
      { label: 'プロジェクト', value: projects.status === 'fulfilled' ? projects.value.length : 0 },
      { label: 'お気に入り', value: favorites.status === 'fulfilled' ? favorites.value.length : 0 },
      { label: 'スタジオ', value: studios.status === 'fulfilled' ? studios.value.length : 0 }
    ]));
    if (projects.status === 'fulfilled' && projects.value.length > 0) {
      d.appendChild(sectionTitle('最近のプロジェクト', 'deployed_code'));
      projects.value.slice(0, 6).forEach(p => {
        d.appendChild(statCard(p.title, p.stats?.views, 'visibility',
          `${icon('favorite', { size: 14 })} ${fmt(p.stats?.loves)} &nbsp; ${icon('star', { size: 14 })} ${fmt(p.stats?.favorites)}`,
          { text: true }));
      });
    }
    setProgress(100);
    toast(`「${username}」の分析完了`, 'check_circle');
  } catch (e) {
    hideLoader();
    showError('ユーザーデータの取得に失敗', `${e.message}\n対象ユーザー「${username}」が存在しないか、APIに到達できません。`);
    toast('取得に失敗しました', 'warning');
  }
}

/* ---- プロジェクト分析 ---- */
async function analyzeProject(id) {
  clearDashboard(); setProgress(10);
  toast(`プロジェクト ${id} を分析中...`, 'search');
  try {
    const project = await apiFetch(`/projects/${id}`);
    setProgress(40);
    const d = $('dashboard');
    d.appendChild(sectionTitle('プロジェクト情報', 'deployed_code'));
    d.appendChild(statCard('タイトル', project.title, 'title', '', { text: true }));
    d.appendChild(statCard('作者', project.author?.username || '—', 'person', '', { text: true }));
    d.appendChild(statCard('説明', (project.description || '説明なし').slice(0, 60) + '...', 'description', '', { text: true }));
    d.appendChild(sectionTitle('統計', 'monitoring'));
    d.appendChild(statCard('閲覧数', project.stats?.views, 'visibility', '', { color: 'color:var(--accent-cyan)' }));
    d.appendChild(statCard('ラブ', project.stats?.loves, 'favorite'));
    d.appendChild(statCard('お気に入り', project.stats?.favorites, 'star'));
    d.appendChild(statCard('リミックス', project.stats?.remixes, 'fork_right'));
    d.appendChild(barChart('エンゲージメント', [
      { label: '閲覧', value: project.stats?.views || 0 },
      { label: 'ラブ', value: project.stats?.loves || 0 },
      { label: 'お気に入り', value: project.stats?.favorites || 0 },
      { label: 'リミックス', value: project.stats?.remixes || 0 }
    ]));
    setProgress(70);
    try {
      const comments = await apiFetch(`/users/${project.author.username}/projects/${id}/comments?limit=20`);
      if (comments.length > 0) {
        d.appendChild(sectionTitle(`コメント (${comments.length}件)`, 'chat'));
        comments.slice(0, 8).forEach(c => {
          d.appendChild(statCard(c.author?.username || '匿名', (c.content || '').slice(0, 50) + '...', 'chat', '', { text: true }));
        });
      }
    } catch (_) {}
    setProgress(100);
    toast(`「${project.title}」の分析完了`, 'check_circle');
  } catch (e) {
    hideLoader();
    showError('プロジェクトデータの取得に失敗', `${e.message}\n対象プロジェクト ID「${id}」が存在しないか、APIに到達できません。`);
    toast('取得に失敗しました', 'warning');
  }
}

/* ---- 初期ダッシュボード ---- */
async function loadInitialDashboard() {
  try {
    setProgress(20);
    const featured = await apiFetch('/explore/projects?mode=popular&limit=20');
    setProgress(50);
    clearDashboard();
    const d = $('dashboard');
    d.appendChild(sectionTitle('Scratch Pulse — ライブ統計', 'bolt'));
    d.appendChild(statCard('API ステータス', '接続済み', 'sensors', '', { text: true, color: 'color:var(--accent-green)' }));
    d.appendChild(statCard('人気プロジェクト', featured.length, 'local_fire_department'));
    if (featured.length > 0) {
      d.appendChild(sectionTitle('人気プロジェクト TOP', 'local_fire_department'));
      featured.slice(0, 10).forEach((p, i) => {
        d.appendChild(statCard(`#${i + 1} ${p.title}`, p.stats?.views, 'visibility',
          `${icon('person', { size: 14 })} ${p.author?.username || '—'} &nbsp; ${icon('favorite', { size: 14 })} ${fmt(p.stats?.loves)}`,
          { text: true, color: i < 3 ? 'color:var(--accent-orange)' : '' }));
      });
      d.appendChild(barChart('人気プロジェクト閲覧数 TOP 8',
        featured.slice(0, 8).map(p => ({ label: p.title.slice(0, 14), value: p.stats?.views || 0 }))));
    }
    setProgress(100);
    toast('Scratch Pulse へようこそ', 'bolt');
  } catch (e) {
    hideLoader();
    showError('初期データの取得に失敗', `${e.message}\n※ 速度テストは上部で独立して動作します。`);
    toast('速度テストは利用できます', 'speed');
  }
}

/* ---- 検索ハンドラ ---- */
const typeIcons = { users: 'person', projects: 'deployed_code', studios: 'palette' };
$('searchType').addEventListener('change', e => {
  $('typeIcon').textContent = typeIcons[e.target.value] || 'search';
});
$('searchBtn').addEventListener('click', () => {
  const type = $('searchType').value;
  const query = $('searchInput').value.trim();
  if (!query) { toast('キーワードを入力してください', 'warning'); return; }
  if (type === 'users') analyzeUser(query);
  else if (type === 'projects') analyzeProject(query);
  else if (type === 'studios') analyzeStudio(query);
});
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('searchBtn').click(); });

/* ---- 起動 ---- */
loadInitialDashboard();

/* ---- タブ ---- */
function addTabs() {
  const d = $('dashboard');
  if (!d.children.length) return;
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  tabs.innerHTML = `
    <button class="tab-btn active" data-tab="all">${icon('apps')}すべて</button>
    <button class="tab-btn" data-tab="stats">${icon('monitoring')}統計</button>
    <button class="tab-btn" data-tab="charts">${icon('bar_chart')}チャート</button>
    <button class="tab-btn" data-tab="projects">${icon('deployed_code')}プロジェクト</button>
  `;
  d.prepend(tabs);
  tabs.addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    d.querySelectorAll('.stat-card, .chart-card, .section-title').forEach(el => {
      if (tab === 'all') { el.style.display = ''; return; }
      if (tab === 'stats') el.style.display = el.classList.contains('stat-card') ? '' : 'none';
      if (tab === 'charts') el.style.display = el.classList.contains('chart-card') ? '' : 'none';
      if (tab === 'projects') el.style.display = el.textContent.includes('プロジェクト') ? '' : 'none';
    });
  });
}
setTimeout(addTabs, 1500);

/* ---- キーボード ---- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    $('searchInput').focus();
  }
});
